# Local/production-like stack: PostgreSQL + the app (API + storefront + admin on one origin).
# NOTE: this compose file was written but not run in the build environment (no Docker daemon).
# Put TLS in front of it (Caddy/nginx/Cloudflare) for production and set TRUST_PROXY=true.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U shop -d shop"], interval: 5s, retries: 10 }
  app:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
      AUTO_MIGRATE: "false"
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  migrate:                     # run once:  docker compose run --rm migrate
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
    command: ["python", "-m", "backend.database.migrate"]
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]
volumes:
  dbdata:
